<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tacticfy</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/tacticfy-64.png">
  <link rel="stylesheet" href="assets/app.css">
  <script src="theme-init.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="min-h-dvh bg-canvas text-ink antialiased">

  <!-- Toolbar -->
  <header class="sticky top-0 z-30 border-b border-line bg-surface/90 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] flex-wrap items-center gap-x-2 gap-y-2 px-3 py-2 sm:px-4 xl:flex-nowrap">
      <div class="me-1 flex items-center gap-2">
        <img src="assets/tacticfy-64.png" alt="" class="size-7" width="28" height="28">
        <span class="text-[15px] font-semibold tracking-tight">Tacticfy</span>
      </div>

      <div class="flex flex-wrap items-center gap-1">
        <button id="btn-load" class="btn btn-success" data-i18n-title="toolbar.load_tip">
          <svg id="load-spinner" class="hidden size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span id="load-label" data-i18n="toolbar.load">Load from FM27</span>
        </button>
        <button id="btn-calibrate" class="btn" data-i18n="toolbar.calibrate" data-i18n-title="toolbar.calibrate_tip">Calibrate</button>
        <button id="btn-import" class="btn" data-i18n="toolbar.import" data-i18n-title="toolbar.import_tip">Import</button>
        <input id="import-file" type="file" class="hidden" accept=".html,.htm,.csv,.rtf,.txt">
      </div>

      <div class="flex min-w-0 flex-wrap items-center gap-1 xl:flex-nowrap">
        <label class="flex min-w-0 items-center gap-1.5 text-xs text-ink-3">
          <span class="sr-only 2xl:not-sr-only" data-i18n="toolbar.style">Style</span>
          <select id="sel-style" class="field w-40 min-w-0 2xl:w-48" data-i18n-title="toolbar.style"></select>
        </label>
        <label class="flex min-w-0 items-center gap-1.5 text-xs text-ink-3">
          <span class="sr-only 2xl:not-sr-only" data-i18n="toolbar.formation">Formation</span>
          <select id="sel-formation" class="field w-48 min-w-0 2xl:w-60" data-i18n-title="toolbar.formation"></select>
        </label>
        <label class="flex cursor-pointer items-center gap-1.5 px-1 text-xs whitespace-nowrap text-ink-2" data-i18n-title="toolbar.important_tip">
          <input id="chk-important" type="checkbox" class="size-4 accent-accent">
          <span data-i18n="toolbar.important">Important Match</span>
        </label>
      </div>

      <div class="ms-auto flex flex-wrap items-center gap-1 xl:flex-nowrap">
        <button id="btn-theme" class="btn" data-i18n-title="toolbar.theme_tip">Theme: Light</button>
        <button id="btn-lang" class="btn" data-i18n-title="toolbar.lang_tip"><bdi dir="ltr">Lang: EN / עב</bdi></button>
        <button id="btn-bug" class="btn" data-i18n="toolbar.report_bug" data-i18n-title="toolbar.report_bug_tip">Report Bug</button>
        <button id="btn-quit" class="btn btn-ghost w-8 px-0" data-i18n-title="web.quit_tip">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
          <span class="sr-only" data-i18n="web.quit">Quit</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] px-3 pt-3 pb-6 sm:px-4">
    <!-- Tabs + status -->
    <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
      <nav class="segmented" role="tablist">
        <button class="seg" role="tab" data-tab="tactics" data-i18n="tab.tactics">Tactical Pitch &amp; Instructions</button>
        <button class="seg" role="tab" data-tab="squad" data-i18n="tab.squad">Squad &amp; Hidden Attributes</button>
        <button class="seg" role="tab" data-tab="advisor" data-i18n="tab.advisor">Squad Planner &amp; Transfer Advisor</button>
      </nav>
      <p id="status" class="min-w-0 flex-1 truncate text-end text-xs text-ink-3" role="status" aria-live="polite"></p>
    </div>

    <!-- Tactics -->
    <section id="view-tactics" data-view="tactics">
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <h1 id="summary" class="min-w-0 text-sm font-semibold"></h1>
        <div class="segmented" role="group">
          <button class="seg" data-mode="BEST" data-i18n="tactics.mode.best">Best XI</button>
          <button class="seg" data-mode="SECOND" data-i18n="tactics.mode.second">Second XI</button>
          <button class="seg" data-mode="DROPOFF" data-i18n="tactics.mode.dropoff">Drop-Off</button>
          <button class="seg" data-mode="BENCH" data-i18n="tactics.mode.bench">Bench &amp; Subs</button>
        </div>
      </div>
      <div class="grid gap-3 lg:grid-cols-[minmax(0,1fr)_340px]">
        <div class="card min-h-[420px] p-2">
          <div id="pitches" class="grid gap-2 sm:grid-cols-2" dir="ltr"></div>
          <div id="bench" class="hidden p-2"></div>
        </div>
        <aside class="card flex max-h-[calc(100dvh-170px)] min-h-[420px] flex-col">
          <div class="flex items-center justify-between border-b border-line px-4 py-2.5">
            <h2 class="text-sm font-semibold" data-i18n="tactics.match_plan">Match Plan</h2>
            <button id="btn-copy" class="btn btn-sm" data-i18n="tactics.copy_plan" data-i18n-title="tactics.copy_tip" disabled>Copy Plan</button>
          </div>
          <div class="scroll-thin flex-1 overflow-y-auto px-4 py-3 text-xs">
            <div id="instructions"></div>
            <hr class="my-3 border-line">
            <div id="detail"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- Squad -->
    <section id="view-squad" data-view="squad" class="hidden">
      <div class="mb-2 flex flex-wrap items-center gap-3">
        <input id="squad-search" type="search" class="field w-80 max-w-full" data-i18n-placeholder="squad.search">
        <span id="squad-count" class="text-xs text-ink-3"></span>
        <span class="ms-auto text-xs text-ink-3" data-i18n="squad.lock_hint"></span>
      </div>
      <div class="card scroll-thin overflow-auto">
        <table id="squad-table" class="w-full text-xs"></table>
      </div>
    </section>

    <!-- Advisor -->
    <section id="view-advisor" data-view="advisor" class="hidden">
      <div class="card mb-3 p-4">
        <h2 class="mb-2 text-sm font-semibold text-warn" data-i18n="advisor.weakest.title"></h2>
        <div id="weakest" class="text-sm"></div>
      </div>
      <div id="buckets" class="mb-3 grid gap-3 md:grid-cols-2"></div>
      <div class="card p-4">
        <h2 class="mb-2 text-sm font-semibold text-accent-ink" data-i18n="advisor.training.title"></h2>
        <div id="training" class="scroll-thin overflow-x-auto text-xs"></div>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex justify-center px-4"></div>

  <!-- Modal -->
  <dialog id="modal" class="m-auto w-[min(560px,calc(100vw-32px))] rounded-2xl border border-line bg-surface p-0 text-ink shadow-2xl backdrop:bg-black/40">
    <form method="dialog" class="flex max-h-[85dvh] flex-col">
      <div class="border-b border-line px-5 py-3.5"><h2 id="modal-title" class="font-semibold"></h2></div>
      <div id="modal-body" class="scroll-thin overflow-y-auto px-5 py-4 text-sm"></div>
      <div id="modal-actions" class="flex flex-wrap justify-end gap-2 border-t border-line px-5 py-3"></div>
    </form>
  </dialog>

  <!-- Server gone -->
  <div id="offline" class="fixed inset-0 z-[60] hidden items-center justify-center bg-canvas/95 p-6">
    <div class="max-w-md text-center">
      <img src="assets/tacticfy-64.png" alt="" class="mx-auto mb-4 size-12" width="48" height="48">
      <h2 id="offline-title" class="text-lg font-semibold"></h2>
      <p id="offline-body" class="mt-2 text-sm text-ink-2"></p>
    </div>
  </div>
</body>
</html>
